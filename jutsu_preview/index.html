<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rouleau des Jutsu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : une scène 3D plein cadre, un rouleau de techniques à gauche (en dessous sur téléphone). */
:root {
  color-scheme: dark;
  --ink: #10131f;        /* fond de scène, encre indigo */
  --panel: #161a29;      /* rouleau */
  --panel-2: #1d2235;    /* survol, carte */
  --line: #2b3149;
  --paper: #ece6d6;      /* texte, ton papier */
  --muted: #9298ae;
  --seal: #c8452f;       /* tampon hanko, rang S */
  --rank-c: #7fa784;
  --rank-b: #5b8fd0;
  --rank-a: #d0a04a;
  --rank-s: #c8452f;
  --el-fire: #ff8a45;
  --el-wind: #84d6c8;
  --el-lightning: #aebcff;
  --el-water: #55b4f2;
  --el-earth: #c9a066;
  --el-other: #c5b3ff;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--paper); font: 14px/1.5 var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--el-lightning); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); }
.panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 18px 16px 12px; display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font: 800 22px/1.1 var(--f-display); letter-spacing: .02em; text-wrap: balance; }
.brand .kanji { font: 600 15px var(--f-display); color: var(--muted); }

.filters { padding: 0 16px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 4px; }
.tab { flex: 1; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 6px 0 5px; cursor: pointer; display: grid; justify-items: center; line-height: 1.15; }
.tab b { font: 800 16px var(--f-display); }
.tab small { font: 400 10.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { background: var(--panel-2); border-color: var(--rank-color, var(--paper)); }
.tab[aria-pressed="true"] b { color: var(--rank-color, var(--paper)); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 10px 2px 6px; cursor: pointer; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.chip i { font: 600 13px var(--f-display); font-style: normal; color: var(--el); }
.chip[aria-pressed="true"] { color: var(--paper); border-color: var(--el); background: color-mix(in srgb, var(--el) 12%, transparent); }

.list { list-style: none; margin: 0; padding: 6px 8px 16px; overflow-y: auto; min-height: 0; flex: 1; }
.rank-head { font: 500 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 12px 8px 4px; display: flex; align-items: center; gap: 8px; }
.rank-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.item { width: 100%; text-align: left; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 6px; border: 1px solid transparent; background: transparent; cursor: pointer; }
.item:hover { background: var(--panel-2); }
.item[aria-current="true"] { background: var(--panel-2); border-color: var(--line); }
.el-seal { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; font: 600 15px var(--f-display); color: var(--el); background: color-mix(in srgb, var(--el) 13%, transparent); }
.item .nm { min-width: 0; }
.item .nm strong { display: block; font-weight: 500; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .nm span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank { width: 22px; height: 22px; display: grid; place-items: center; font: 800 12px var(--f-display); color: var(--rank-color); border: 1.5px solid var(--rank-color); border-radius: 4px; }
.rank.S { background: var(--rank-s); color: var(--paper); border-color: var(--rank-s); }
.empty { color: var(--muted); padding: 24px 8px; text-align: center; }

.stage { position: relative; min-width: 0; min-height: 0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; top: 12px; right: 12px; font: 400 11.5px var(--f-mono); color: var(--muted); background: color-mix(in srgb, var(--ink) 70%, transparent); padding: 4px 8px; border-radius: 4px; font-variant-numeric: tabular-nums; pointer-events: none; }
.card { position: absolute; left: 16px; bottom: 16px; width: min(440px, calc(100% - 32px)); background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 12px; display: grid; gap: 8px; }
.card-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.big-rank { width: 46px; height: 46px; display: grid; place-items: center; font: 800 24px var(--f-display); border: 2px solid var(--rank-color); color: var(--rank-color); border-radius: 6px; transform: rotate(-4deg); }
.big-rank.S { background: var(--rank-s); color: var(--paper); }
.card h2 { margin: 0; font: 800 18px/1.2 var(--f-display); text-wrap: balance; }
.card .jp { font: 600 13px var(--f-display); color: var(--el); }
.card .meta { font-size: 12px; color: var(--muted); }
.card p { margin: 0; font-size: 13px; color: color-mix(in srgb, var(--paper) 85%, var(--muted)); max-width: 62ch; }
.fxline { font: 400 11.5px var(--f-mono); color: var(--muted); }
.fxline b { color: var(--el); font-weight: 500; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 2px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--paper); color: var(--ink); border-color: var(--paper); font-weight: 700; }
.btn[aria-pressed="true"] { border-color: var(--el-lightning); color: var(--el-lightning); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 8px; cursor: pointer; font: 400 11.5px var(--f-mono); color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--paper); }
.spacer { flex: 1; }
.kbd { font: 400 11px var(--f-mono); color: var(--muted); }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 58%) minmax(0, 42%); }
  .stage { order: -1; }
  .panel { border-right: 0; border-top: 1px solid var(--line); }
  .brand { padding: 10px 16px 8px; }
  .brand h1 { font-size: 18px; }
  .card { left: 8px; right: 8px; bottom: 8px; width: auto; padding: 10px 12px; gap: 6px; }
  .card p, .fxline { display: none; }
  .big-rank { width: 36px; height: 36px; font-size: 19px; }
  .card h2 { font-size: 15px; }
  .kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="brand"><h1>Rouleau des Jutsu</h1><span class="kanji">術の巻物</span></div>
    <div class="filters">
      <div class="tabs" id="tabs" role="group" aria-label="Rang"></div>
      <div class="chips" id="chips" role="group" aria-label="Élément"></div>
    </div>
    <ul class="list" id="list"></ul>
  </aside>
  <main class="stage" id="stage">
    <div class="hud" id="hud">—</div>
    <section class="card" id="card" aria-live="polite">
      <div class="card-top">
        <div class="big-rank" id="cRank">C</div>
        <div>
          <h2 id="cName">—</h2>
          <div class="jp" id="cJp"></div>
          <div class="meta" id="cMeta"></div>
        </div>
      </div>
      <p id="cDesc"></p>
      <div class="fxline" id="cFx"></div>
      <div class="controls">
        <button class="btn primary" id="bPlay" type="button">Rejouer</button>
        <button class="btn" id="bLoop" type="button" aria-pressed="true">Boucle</button>
        <div class="seg" id="speed" role="group" aria-label="Vitesse">
          <button type="button" data-s="0.25">0,25×</button>
          <button type="button" data-s="0.5">0,5×</button>
          <button type="button" data-s="1" aria-pressed="true">1×</button>
        </div>
        <span class="spacer"></span>
        <span class="kbd">Espace · ↑ ↓</span>
      </div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  shake(a){ this.shakeA = Math.max(this.shakeA, a); },
  hit(s){ dummy.userData.vel += s*2.2; },
  addMesh(m){ scene.add(m); this.meshes.push(m); return m; },
  removeMesh(m){ scene.remove(m); m.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); this.meshes = this.meshes.filter(x => x !== m); },
  pose(p){ caster.userData.pose = { down:0, forward:-Math.PI/2, up:-Math.PI*.95 }[p] ?? 0; },
  hand(c=caster){ c.updateMatrixWorld(true); return c.userData.tip.getWorldPosition(V()); },
  mouth(c=caster){ c.updateMatrixWorld(true); return c.localToWorld(V(0, 1.6, .32)); },
  chest(c=caster){ c.updateMatrixWorld(true); return c.localToWorld(V(0, 1.25, .2)); },
  origin(f){ return f === "hand" ? this.hand() : f && f.isVector3 ? f.clone() : this.mouth(); },
  reset(){
    this.tasks = []; this.time = 0;
    [...this.meshes].forEach(m => this.removeMesh(m));
    ADD.clear(); NORM.clear();
    caster.position.set(0,0,0); caster.rotation.set(0,0,0); caster.visible = true; caster.userData.pose = 0;
    caster.userData.armR.rotation.x = 0;
    casterMat.color.copy(CASTER_COLOR); casterMat.roughness = .6; casterMat.metalness = 0;
    clones.forEach(c => { c.visible = false; c.rotation.set(0,0,0); c.userData.armR.rotation.x = 0; });
    dummy.userData.ang = 0; dummy.userData.vel = 0; dummy.userData.sink = 0; dummy.visible = true;
    this.flashI = 0; this.glowT = 0; this.glowI = 0;
  },
};

// Base vectorielle orientée vers dir
function basis(dir){ const f = dir.clone().normalize(), up0 = Math.abs(f.y) > .95 ? V(1,0,0) : V(0,1,0);
  const side = V().crossVectors(up0, f).normalize(), up = V().crossVectors(f, side).normalize(); return { f, side, up }; }

const FX = {};

// --- Impact générique
FX.impact = (p, o) => {
  const pal = PAL[o.pal], s = o.impactR || 2, kind = o.impact || "explode";
  if (kind === "explode"){
    puff(ADD, p, 140*s, { r:.3*s, sp0:1, sp1:6*s, drag:3.5, life:[.35,.9], size:[.9*s*.6,.2*s], g:pal.core });
    puff(ADD, p, 90*s, { r:.4*s, sp0:.5, sp1:4*s, drag:3, life:[.6,1.2], size:[.9*s*.6,1.4*s*.6], g:pal.outer });
    puff(ADD, p, 40*s, { sp0:4, sp1:12, life:[.5,1.1], size:[.12,.05], g:pal.spark, grav:7, drag:.5 });
    if (pal.smoke) puff(NORM, p, 30*s, { r:.6*s, sp:1.4*s, vel:V(0,1.6,0), drag:1.2, life:[1.4,2.6], size:[.6*s,2.2*s], g:pal.smoke, turb:1 });
    ring(ADD, V(p.x,.15,p.z), 70*s, { rad:.3, sp:5*s, drag:3, life:[.4,.8], size:[.5*s*.5,.1], g:pal.outer });
    S.flash(pal.light, 5*s, p); S.shake(.18*s); if (!o.noHit) S.hit(1.1*s);
    if (o.storm) S.task(.15, 1.8, (dt,k) => {
      const c = emit(700*(1-k*.6), dt);
      for (let i=0;i<c;i++){ const a = rand(0,TAU), rr = Math.sqrt(Math.random())*s*1.3;
        ADD.spawn(p.x+Math.cos(a)*rr, rand(0,.6), p.z+Math.sin(a)*rr, rand(-.5,.5), rand(3,7), rand(-.5,.5), rand(.5,1), rand(.7,1.4), .2, pal.core, .6, 0, 2);
        if (i%6===0) NORM.spawn(p.x+Math.cos(a)*rr, rand(1,3), p.z+Math.sin(a)*rr, 0, rand(1,2.5), 0, rand(1.2,2.2), 1, 3, pal.smoke, .2, 0, 1); }
      S.glow(pal.light, 4*(1-k), p); if (Math.random() < dt*4) S.hit(.3);
    });
  } else if (kind === "splash"){
    puff(ADD, p, 160*s, { r:.3*s, sp0:2, sp1:5*s, vel:V(0,3.2,0), grav:11, life:[.6,1.3], size:[.28,.12], g:pal.core });
    puff(NORM, p, 40*s, { r:.5*s, sp:2*s, drag:2, life:[.8,1.6], size:[.5*s,1.6*s], g:pal.smoke, turb:.6 });
    ring(ADD, V(p.x,.12,p.z), 90*s, { rad:.4*s, sp:4*s, up:2.5, grav:8, drag:1.5, life:[.5,.9], size:[.35,.1], g:pal.outer });
    S.flash(pal.light, 3*s, p); S.shake(.12*s); S.hit(1*s);
  } else if (kind === "shock"){
    ring(ADD, p, 220*s, { rad:.2, sp:7*s, drag:3.2, life:[.4,.75], size:[.35,.08], g:pal.core, axis:V(0,1,0) });
    ring(ADD, p, 160*s, { rad:.2, sp:6*s, drag:3.2, life:[.4,.75], size:[.35,.08], g:pal.core, axis:V(0,0,1) });
    puff(ADD, p, 120*s, { r:.4*s, sp0:2, sp1:7*s, drag:3, life:[.3,.6], size:[.6,.1], g:pal.outer });
    ring(NORM, V(p.x,.1,p.z), 60*s, { rad:.5*s, sp:4*s, up:.6, drag:1.5, life:[1,1.8], size:[.6,2], g:pal.smoke || PAL.wind.smoke });
    S.flash(pal.light, 4*s, p); S.shake(.22*s); S.hit(1.4*s);
  } else if (kind === "spark"){
    S.task(0, .45, () => { for (let i=0;i<3;i++){ rdir(_d); bolt(p, p.clone().addScaledVector(_d, rand(.8,1.8)*s*.6), { w:.07, depth:3, branches:0, life:.06 }); } });
    puff(ADD, p, 90*s, { sp0:3, sp1:9, life:[.3,.8], size:[.12,.04], g:pal.spark, grav:8 });
    S.flash(pal.light, 6*s, p); S.shake(.15*s); S.hit(1.2*s);
  } else if (kind === "mud"){
    puff(NORM, p, 70*s, { r:.3*s, sp0:2, sp1:6*s, vel:V(0,2,0), grav:14, life:[.7,1.3], size:[.25,.2], g:PAL.earth.core });
    puff(NORM, p, 30*s, { r:.4*s, sp:2, drag:2, life:[1,1.8], size:[.6,1.8], g:PAL.earth.smoke });
    S.shake(.12*s); S.hit(.9*s);
  }
};

// --- Projectile : charge, vol, impact
FX.projectile = o => {
  const pal = PAL[o.pal], pool = corePool(pal), n = o.n || 1, r = o.r || .6, speed = o.speed || 14, charge = o.charge ?? .5;
  if (!o.origin) S.pose(o.from === "hand" ? "forward" : "down");
  S.task(0, charge, (dt,k) => {
    const m = o.origin ? o.origin.clone() : S.origin(o.from), c = emit(220*Math.max(.4,r), dt);
    for (let i=0;i<c;i++){ rdir(_d); const R = r*2.2; pool.spawn(m.x+_d.x*R, m.y+_d.y*R, m.z+_d.z*R, -_d.x*R/.25, -_d.y*R/.25, -_d.z*R/.25, .25, r*.45, r*.1, pal.core); }
    S.glow(pal.light, 2*k, m);
  });
  for (let j=0;j<n;j++){
    S.at(charge + j*(o.gap || .18), () => {
      const start = o.origin ? o.origin.clone() : S.origin(o.from);
      const end = o.to ? o.to.clone() : AIM.clone(); if (o.spread){ end.x += rand(-1,1)*o.spread; end.y += rand(-.6,.9)*o.spread*.5; }
      const B = basis(end.clone().sub(start)), bend = (o.curve || 0)*rand(-1,1), dur = start.distanceTo(end)/speed;
      const prev = start.clone();
      S.task(0, dur, (dt,k) => {
        const p = start.clone().lerp(end, k).addScaledVector(B.side, Math.sin(Math.PI*k)*bend).addScaledVector(B.up, Math.sin(Math.PI*k)*(o.arc||0));
        const seg = Math.max(1, Math.ceil(p.distanceTo(prev)/(r*.5)));
        for (let s=1;s<=seg;s++){
          _t.copy(prev).lerp(p, s/seg);
          puff(pool, _t, 5*Math.max(.5,r), { r:r*.45, sp:r*.8, life:[.12,.28], size:[r*1.25,r*.3], g:pal.core, drag:2 });
          puff(ADD, _t, 3, { r:r*.6, sp:.5, life:[.3,.6], size:[r*1.1,r*.2], g:pal.outer || pal.core });
          if (pal.smoke && Math.random() < .5) puff(NORM, _t, 1, { r:r*.4, sp:.3, vel:V(0,1,0), life:[.8,1.5], size:[r*.6,r*2], g:pal.smoke, turb:.8 });
        }
        S.glow(pal.light, 3*Math.max(.6,r), p); prev.copy(p);
        if (k >= 1) FX.impact(p, o);
      });
    });
  }
};

// --- Souffle continu en cône
FX.stream = o => {
  const pal = PAL[o.pal], pool = corePool(pal), charge = o.charge ?? .3, life = o.life || .9, len = o.len || 12, sz = o.size || [.4,2];
  S.pose(o.from === "hand" ? "forward" : "down");
  S.task(0, charge, (dt,k) => { const m = S.origin(o.from); puff(pool, m, emit(160,dt)/Q, { r:.25, sp:.6, life:[.1,.25], size:[.35,.1], g:pal.core }); S.glow(pal.light, 1.5*k, m); });
  S.task(charge, o.dur || 2, (dt,k,lt,acc) => {
    const m = S.origin(o.from), B = basis(AIM.clone().sub(m)), sp = len/life, c = emit(o.rate || 600, dt), ramp = Math.min(1, lt/.25)*(k > .85 ? (1-k)/.15 : 1);
    for (let i=0;i<c*ramp;i++){
      const th = rand(0,TAU), rr = (o.cone || .25)*Math.sqrt(Math.random());
      _d.copy(B.f).addScaledVector(B.side, Math.cos(th)*rr).addScaledVector(B.up, Math.sin(th)*rr).normalize();
      const v = sp*rand(.75,1.1);
      pool.spawn(m.x,m.y,m.z, _d.x*v,_d.y*v,_d.z*v, life*rand(.6,1), sz[0]*rand(.7,1.2), sz[1]*rand(.7,1.2), pal.core, .5, o.grav||0, 2);
      if (i%3===0 && pal.outer) ADD.spawn(m.x,m.y,m.z, _d.x*v*.9,_d.y*v*.9,_d.z*v*.9, life*rand(.7,1.1), sz[0]*1.4, sz[1]*1.3, pal.outer, .6, o.grav||0, 2);
      if (i%7===0 && pal.smoke) NORM.spawn(m.x,m.y,m.z, _d.x*v*.6,_d.y*v*.6+.8,_d.z*v*.6, life*rand(1.3,2), sz[0], sz[1]*1.6, pal.smoke, .8, -.6, 1.2);
    }
    if (o.dust && Math.random() < .6) puff(NORM, V(rand(-2,2),.1,rand(3,12)), 6, { r:.4, sp:1, vel:V(0,.8,5), drag:.6, life:[.8,1.6], size:[.4,1.6], g:pal.smoke });
    S.glow(pal.light, (o.heavy ? 6 : 3.5)*ramp, m.clone().addScaledVector(B.f, len*.45));
    if (o.heavy) S.shake(.06*ramp);
    acc.h = (acc.h || 0) + dt; if (acc.h > .25 && lt > life*.8){ acc.h = 0; S.hit(o.heavy ? .55 : .3); }
  });
};

// --- Dragon : tête qui suit une courbe, corps en traînée
function dragonPath(type, off){
  const m = S.mouth(), end = AIM.clone().add(V(off*.8, 0, 0));
  if (type === "arc") return u => m.clone().lerp(end, u).add(V(Math.sin(u*Math.PI*3)*1.1*(1-u*.4) + off*Math.sin(Math.PI*u)*2, Math.sin(Math.PI*u)*2.2, 0));
  if (type === "rise"){
    const top = a => { const ang = a*TAU*1.25; return V(off*2 + Math.cos(ang)*1.3, -.6 + a*7.5, 3 + Math.sin(ang)*1.3); };
    const P1 = top(1), C = V(P1.x, P1.y + 2.5, 7.5);
    return u => { if (u < .55) return top(u/.55); const b = (u-.55)/.45, ib = 1-b;
      return V(ib*ib*P1.x + 2*ib*b*C.x + b*b*end.x, ib*ib*P1.y + 2*ib*b*C.y + b*b*end.y, ib*ib*P1.z + 2*ib*b*C.z + b*b*end.z); };
  }
  if (type === "sky"){
    const P0 = V(off*4 + 1.5, 15, 2), C = V(off*3 - 2, 10, 13);
    return u => { const iu = 1-u; return V(iu*iu*P0.x + 2*iu*u*C.x + u*u*end.x + Math.sin(u*TAU*1.5)*.8, iu*iu*P0.y + 2*iu*u*C.y + u*u*end.y, iu*iu*P0.z + 2*iu*u*C.z + u*u*end.z); };
  }
  if (type === "low") { const st = V(off*1.4, .7, 1); const e2 = V(off*.5, .9, 11);
    return u => st.clone().lerp(e2, u).add(V(Math.sin(u*Math.PI*4)*.45, Math.sin(u*Math.PI*6)*.2, 0)); }
  if (type === "emerge") return u => V(Math.sin(u*Math.PI*2)*.3, -.6 + easeOut(u)*4, 2 + u*1.4);
  return u => m.clone().lerp(end, u);
}
FX.dragon = o => {
  const pal = PAL[o.pal], pool = corePool(pal), n = o.n || 1, head = o.head || .8, body = o.body || .7, dur = o.dur || 1.5;
  S.pose(o.path === "sky" ? "up" : o.path === "rise" ? "forward" : "down");
  for (let j=0;j<n;j++){
    const off = j - (n-1)/2;
    S.at((o.delay || 0) + j*.28, () => {
      const path = dragonPath(o.path, off); const prev = path(0);
      if (o.path === "rise" || o.path === "emerge") FX.impact(V(prev.x, .2, prev.z), { pal:o.pal, impact:o.pal === "earth" ? "mud" : "splash", impactR:1 });
      S.task(0, dur, (dt,k) => {
        const p = path(o.path === "low" ? k : easeInOut(k)*.15 + k*.85);
        const steps = Math.max(1, Math.ceil(p.distanceTo(prev)/(head*.3)));
        for (let s=1;s<=steps;s++){
          _t.copy(prev).lerp(p, s/steps);
          puff(pool, _t, 3, { r:head*.4, sp:.4, life:[body*.6,body], size:[head*1.3,head*.15], g:pal.core, turb:.6 });
          puff(ADD, _t, 2, { r:head*.6, sp:.6, life:[body*.7,body*1.1], size:[head*1.5,head*.3], g:pal.outer || pal.core });
          if (pal.smoke && Math.random() < .35) puff(NORM, _t, 1, { r:head*.5, sp:.4, vel:V(0,.6,0), life:[1,1.8], size:[head*.8,head*2], g:pal.smoke, turb:.8 });
        }
        puff(ADD, p, 5, { r:head*.25, sp:1.4, life:[.1,.2], size:[head*1.7,head], g:pal.core });
        S.glow(pal.light, 3.5, p); prev.copy(p);
        if (k >= 1 && o.impact) FX.impact(p, { ...o, impactR:o.impactR || head*2 });
      });
    });
  }
};

// --- Éclair rampant au sol
FX.crawl = o => {
  S.pose("forward");
  S.task(.25, .2, () => { const h = S.hand(); bolt(h, V(0,.05,1.1), { w:.08, depth:4, branches:0, life:.06 }); });
  S.task(.35, 1.9, (dt,k,lt) => {
    const front = 1.1 + 9.9*Math.min(1, lt/.65), pts = [V(0,.05,1.1)];
    for (let z = 1.1; z < front; z += .9) pts.push(V(Math.sin(z*1.7 + lt*9)*.5, .06 + Math.random()*.08, Math.min(z+.9, front)));
    if (Math.random() < .8) boltCurve(pts, { w:.07, glow:.3, jag:.15, depth:3, life:.05, branchChance:.25 });
    puff(ADD, pts[pts.length-1], 6, { sp0:2, sp1:5, vel:V(0,2,0), grav:9, life:[.2,.5], size:[.1,.03], g:PAL.lightning.spark });
    S.glow(PAL.lightning.light, 2.5 + Math.random()*2, pts[pts.length-1]);

// --- Lances d'éclairs (Gian)
FX.lances = o => {

// --- Lames de vent (Kamaitachi)
FX.blades = o => {
  const pal = PAL[o.pal], n = o.n || 6; S.pose("forward");
  for (let j=0;j<n;j++){
    const xo = rand(-1.6,1.6), yo = rand(-.3,1.2), roll = rand(-.9,.9), R = rand(1.2,2), dur = .9;
    S.task(.2 + j*.09, dur, (dt,k,lt,acc) => {
      const cz = 1 + k*20, cx = xo*(1+k), cy = 1.3 + yo*k;
      for (let i=0;i<Math.round(36*Q);i++){
        const th = rand(-1.25,1.25), sx = Math.sin(th)*R, sy = Math.cos(th)*R - R*.55;
        const x = cx + sx*Math.cos(roll) - sy*Math.sin(roll), y = cy + sx*Math.sin(roll) + sy*Math.cos(roll), z = cz - (1-Math.cos(th))*R*.8;
        ADD.spawn(x, Math.max(.05,y), z, 0, 0, 4, .1, .2*(1-Math.abs(th)/1.6), .05, pal.core);
      }
      if (Math.random() < .5) puff(NORM, V(cx,.1,cz), 3, { r:.5, sp:1.2, vel:V(0,.7,2), drag:1, life:[.8,1.4], size:[.3,1.2], g:pal.smoke });
      if (!acc.hit && cz > 11){ acc.hit = 1; S.hit(.55); puff(ADD, V(cx*.3, cy, 11), 30, { sp0:2, sp1:6, life:[.2,.4], size:[.12,.03], g:pal.spark }); }
    });
  }
  S.flash(pal.light, 2, V(0,1.2,2));
};

// --- Murs
FX.wall = o => {
  const pal = PAL[o.pal];
  if (o.kind === "spiral"){
    S.pose("forward");
    S.at(.05, () => FX.impact(V(0,.1,0), { pal:o.pal, impact:"splash", impactR:1.2 }));
    S.task(.1, 2.7, (dt,k,lt) => {
      const h = 3.6*Math.min(1, lt/.45), fade = k > .85 ? (1-k)/.15 : 1, c = emit(1500*fade, dt);
      for (let i=0;i<c;i++){
        const s = Math.floor(Math.random()*12), y = Math.random()*h, a = s*TAU/12 + y*1.1 + lt*5.5, rad = 2.1 + rand(-.12,.12);
        ADD.spawn(Math.cos(a)*rad, y, Math.sin(a)*rad, -Math.sin(a)*2, rand(1,3), Math.cos(a)*2, rand(.15,.3), .38, .12, i%4 ? pal.core : pal.outer, 1, 0, .5);
      }
      if (Math.random() < .7) puff(NORM, V(rand(-2,2), h, rand(-2,2)), 3, { r:.3, sp:1, vel:V(0,1,0), grav:4, life:[.5,1], size:[.4,1.1], g:pal.smoke });
      S.glow(pal.light, 2.5*fade, V(0,1.8,0));
      // projectiles adverses qui se brisent sur le mur
      if (Math.random() < dt*2.2) FX.impact(V(rand(-1.2,1.2), rand(.8,2.6), 2.1), { pal:"water", impact:"splash", impactR:.6 });
    });
    S.at(2.8, () => puff(ADD, V(0,2,0), 300, { r:2, sp0:1, sp1:4, vel:V(0,1,0), grav:10, life:[.6,1.2], size:[.3,.1], g:pal.core }));
  } else {
    S.pose("forward");
    const g = new THREE.BoxGeometry(6, 3.6, .9, 12, 8, 2), pa = g.attributes.position;
    for (let i=0;i<pa.count;i++){ pa.setXYZ(i, pa.getX(i) + rand(-.08,.08), pa.getY(i) + rand(-.08,.08), pa.getZ(i) + rand(-.12,.12)); }
    g.computeVertexNormals();
    const wall = S.addMesh(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color:"#6e5a44", roughness:1, flatShading:true })));
    wall.position.set(0, -1.9, 2.8);

FX.orb = o => {

  S.pose("forward");
  const core = S.addMesh(new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), new THREE.MeshBasicMaterial({ color:pal.light, transparent:true, opacity:.9, blending:THREE.AdditiveBlending, depthWrite:false })));

  const axes = Array.from({length:6}, () => rdir(V()).clone());
  S.task(0, charge + dashT + .55, (dt,k,lt) => {
    const h = S.hand(), grow = Math.min(1, lt/.5);
    core.position.copy(h); core.scale.setScalar(r*(o.kind === "chidori" ? .45 : .8)*grow*(.92 + .1*Math.sin(lt*50)));
    if (o.kind === "rasengan"){
      const c = emit(1400*Math.max(.5,r)*grow, dt);
      for (let i=0;i<c;i++){ const ax = axes[i%6]; rdir(_d); _d2.crossVectors(ax, _d).normalize();
        const R = r*rand(.9,1.25), sp = r*14;
        ADD.spawn(h.x+_d.x*R, h.y+_d.y*R, h.z+_d.z*R, _d2.x*sp, _d2.y*sp, _d2.z*sp, rand(.08,.16), r*.35, r*.08, i%3 ? pal.core : pal.outer); }
      S.glow(pal.light, 3*grow, h);
    } else {
      for (let i=0;i<(o.hot ? 4 : 3);i++){ rdir(_d); bolt(h, h.clone().addScaledVector(_d, rand(.4,1.3)*(o.hot ? 1.3 : 1)), { w:.05, glow:.22, depth:3, branches:0, life:.05 }); }
      puff(ADD, h, emit(400,dt)/Q, { r:r*.5, sp0:1, sp1:5, life:[.15,.35], size:[.1,.03], g:pal.spark, grav:6 });
      S.glow(pal.light, (2.5 + Math.random()*3)*grow, h);
      if (lt < charge && Math.random() < .4) bolt(V(h.x, .03, h.z), V(h.x + rand(-1.2,1.2), .03, h.z + rand(-1.2,.4)), { w:.04, depth:3, branches:0, life:.05 });
    }
  });
  S.task(charge, dashT, (dt,k) => { caster.position.z = stopZ*easeInOut(k); const h = S.hand();
    puff(ADD, h, 12, { r:r*.6, sp:.4, life:[.2,.4], size:[r*.8,r*.1], g:pal.outer || pal.core });
    puff(NORM, V(0,.1,caster.position.z), 2, { r:.3, sp:1, vel:V(0,.5,0), life:[.6,1.2], size:[.3,1], g:PAL.earth.smoke }); });
  S.at(charge + dashT, () => {
    const p = S.hand();

      S.task(0, .5, (dt,k) => { ring(ADD, p, 60*r*3, { rad:r, sp:6*r*3, drag:3, life:[.2,.4], size:[.25,.05], g:pal.core, axis:V(0,0,1) }); S.hit(.25); S.glow(pal.light, 6, p); S.shake(.08); });

      const c = emit(2600*fade, dt);
      for (let i=0;i<c;i++){ rdir(_d); const rr = R*Math.cbrt(Math.random()); rdir(_d2);
        ADD.spawn(p.x+_d.x*rr, Math.max(.05, p.y+_d.y*rr), p.z+_d.z*rr, _d2.x*14, _d2.y*14, _d2.z*14, rand(.04,.09), .12, .03, i%3 ? pal.core : PAL.chakra.core); }
      for (let i=0;i<emit(500*fade,dt);i++){ rdir(_d); ADD.spawn(p.x+_d.x*R, Math.max(.05, p.y+_d.y*R), p.z+_d.z*R, 0,0,0, .12, .35, .1, pal.core); }
      S.glow("#d8f8ff", 10*fade, p); S.shake(.25*fade);
      if (Math.random() < dt*8) S.hit(.35);
      if (Math.random() < .5) puff(NORM, V(p.x + rand(-4,4), .1, p.z + rand(-4,4)), 3, { r:.5, sp:3, flat:.3, drag:1, life:[1,1.8], size:[.6,2], g:pal.smoke });
    });
    S.at(1.9, () => { S.removeMesh(shell); ring(ADD, p, 300, { rad:3, sp:8, drag:3, life:[.4,.7], size:[.3,.06], g:pal.core }); });
  }
};

// --- Kirin
FX.kirin = o => {
  S.pose("up");
  S.task(0, 3.6, (dt,k,lt) => {
    const form = Math.min(1, lt/1.6), c = emit(120*(k > .85 ? (1-k)/.15 : 1), dt);
    for (let i=0;i<c;i++){ const a = rand(0,TAU), rr = Math.sqrt(Math.random())*7*form, x = Math.cos(a)*rr, z = Math.sin(a)*rr;
      NORM.spawn(x, 10.5 + rand(-1,1), 11 + z, -z*.08, 0, x*.08, rand(2,3), rand(3,5), rand(5,7), PAL.cloud.smoke, 0, 0, .3); }
    if (lt < 2.2 && Math.random() < dt*5){ const a = V(rand(-5,5), rand(10,11), 11 + rand(-5,5)); const b = a.clone().add(V(rand(-3,3), rand(-.6,.6), rand(-3,3)));
      bolt(a, b, { w:.08, glow:.6, depth:4, branches:1, life:.08 }); S.flash("#9cb8ff", 2, a); }
  });
  S.at(2.3, () => { S.flash("#ffffff", 22, AIM); S.shake(1.3); S.hit(3); });
  S.task(2.3, .75, (dt,k) => {
    const pts = []; for (let i=0;i<=10;i++){ const u = i/10; pts.push(V(Math.sin(u*Math.PI*2.5)*2.2*(1-u), 10.5 - u*9.9, 11 - Math.sin(u*Math.PI*1.5)*1.8*(1-u))); }
    boltCurve(pts, { w:.5*(1-k*.5), glow:2.2, jag:.06, depth:4, life:.06, branchChance:.6 });
    S.glow("#dfe9ff", 14*(1-k), AIM);
    puff(ADD, V(0,.3,11), 40, { sp0:3, sp1:10, vel:V(0,3,0), grav:9, life:[.4,1], size:[.14,.05], g:PAL.lightning.spark });
  });
  S.at(2.35, () => {
    ring(ADD, V(0,.2,11), 400, { rad:.5, sp:12, drag:3, life:[.5,.9], size:[.4,.08], g:PAL.lightning.core });
    puff(NORM, V(0,.4,11), 120, { r:1.5, sp:4, flat:.4, vel:V(0,1,0), drag:1.2, life:[1.6,2.6], size:[1,3.6], g:PAL.earth.smoke, turb:1 });
    const scorch = S.addMesh(new THREE.Mesh(new THREE.CircleGeometry(2.6, 40), new THREE.MeshBasicMaterial({ color:"#0b0c10", transparent:true, opacity:.75 })));
    scorch.rotation.x = -Math.PI/2; scorch.position.set(0, .015, 11);
  });
};

// --- Hiraishin
FX.hiraishin = o => {
  S.pose("forward"); const mark = V(1.3, 0, 12.8);
  S.at(.2, () => { const st = S.hand(), end = mark.clone().add(V(0,.25,0));
    S.task(0, .45, (dt,k) => { const p = st.clone().lerp(end, k).add(V(0, Math.sin(Math.PI*k)*.8, 0)); puff(ADD, p, 6, { sp:.2, life:[.15,.3], size:[.18,.05], g:PAL.flash.core }); }); });
  S.task(.65, 2.8, (dt,k,lt) => { puff(ADD, mark.clone().add(V(0,.25,0)), emit(60,dt)/Q, { r:.15, sp:.5, vel:V(0,.6,0), life:[.3,.6], size:[.15,.04], g:PAL.flash.core }); });
  const jump = (to, rotY) => {
    const a = S.chest(); S.flash(PAL.flash.light, 7, a);
    puff(ADD, a, 160, { r:.4, sp0:1, sp1:6, drag:3, life:[.2,.5], size:[.4,.08], g:PAL.flash.core });
    caster.position.copy(to); caster.rotation.y = rotY;
    const b = S.chest();
    for (let i=0;i<=60;i++){ _t.copy(a).lerp(b, i/60); ADD.spawn(_t.x,_t.y,_t.z, 0,0,0, rand(.25,.5), .35, .05, PAL.flash.core); }
    puff(ADD, b, 160, { r:.4, sp0:1, sp1:6, drag:3, life:[.2,.5], size:[.4,.08], g:PAL.flash.core });
    ring(ADD, V(to.x,.1,to.z), 120, { rad:.3, sp:5, drag:3, life:[.3,.5], size:[.25,.05], g:PAL.flash.outer });
  };
  S.at(1.25, () => { jump(mark, Math.PI); S.pose("forward"); });
  S.at(1.45, () => { const p = AIM.clone().add(V(.5,0,.6)); puff(ADD, p, 70, { sp0:2, sp1:7, life:[.2,.5], size:[.12,.03], g:PAL.flash.spark, grav:6 }); S.hit(-2); S.shake(.35); S.flash(PAL.flash.light, 4, p); });
  S.at(2.9, () => { jump(V(0,0,0), 0); S.pose("down"); });
};

// --- Shiki Fūjin
FX.reaper = o => {
  S.pose("forward"); const G = V(0, 3.1, -1.7), pal = PAL.yin;
  S.task(0, 4.4, (dt,k,lt) => {
    const a = Math.min(1, lt/1)*(k > .9 ? (1-k)/.1 : 1);
    for (let i=0;i<emit(500*a,dt);i++){ rdir(_d); const p = V(G.x + _d.x*1.2, G.y + _d.y*2.1, G.z + _d.z*.7);
      ADD.spawn(p.x,p.y,p.z, rand(-.2,.2), rand(.3,.9), rand(-.2,.2), rand(.6,1.2), rand(.4,.7)*a, .08, i%3 ? pal.outer : pal.core, 0, 0, .6); }
    if (Math.random() < .6*a) puff(NORM, G.clone().add(V(rand(-1.5,1.5), rand(-2,1), rand(-1,.5))), 2, { r:.4, sp:.3, vel:V(0,.5,0), life:[1.2,2], size:[1,2.8], g:pal.smoke, turb:.6 });
    [-.36, .36].forEach(x => ADD.spawn(G.x + x, G.y + 1.3, G.z + .62, 0,0,0, .08, .3*a, .2*a, PAL.thread.glint));
    for (let i=0;i<3;i++){ const s = i%2 ? 1 : -1; ADD.spawn(G.x + s*rand(.5,.8), G.y + 1.9 + rand(0,.5), G.z + .2, 0,0,0, .12, .18*a, .1, pal.core); }
    S.glow(pal.light, 2.5*a, G);
  });
  S.task(1.3, 1.1, (dt,k) => {
    const st = S.chest(), end = AIM.clone(), tip = st.clone().lerp(end, Math.min(1, k*1.6));
    for (let i=0;i<Math.round(30*Q);i++){ _t.copy(st).lerp(tip, Math.random()); ADD.spawn(_t.x + rand(-.05,.05), _t.y + Math.sin(_t.z*3)*.06, _t.z, 0,0,0, .12, .2, .05, pal.core); }
  });
  S.task(2.3, 1.6, (dt,k) => {
    const st = AIM.clone(), v = G.clone().sub(st).multiplyScalar(1/1.2);
    for (let i=0;i<emit(260,dt);i++) ADD.spawn(st.x + rand(-.3,.3), st.y + rand(-.6,.6), st.z + rand(-.2,.2), v.x + rand(-.3,.3), v.y + rand(-.3,.3), v.z, 1.2, .2, .08, PAL.chakra.core, 0, 0, .8);
    if (Math.random() < dt*4) S.hit(.12);
  });
  S.at(4, () => { puff(ADD, G, 300, { r:2, sp0:-4, sp1:-1, radial:true, life:[.3,.5], size:[.4,.05], g:pal.core }); S.flash(pal.light, 6, G); S.shake(.2); });
};

// --- Jiongu : fils noirs et quatre cœurs
FX.threads = o => {
  S.pose("down"); const pal = PAL.thread;
  const hearts = [["fire",-.3,1.55],["wind",.3,1.55],["lightning",-.3,1.1],["water",.3,1.1]];
  S.task(0, 4.2, (dt,k,lt) => { hearts.forEach(([el,x,y]) => { const p = caster.localToWorld(V(x, y, -.32)); puff(ADD, p, emit(50,dt)/Q, { r:.06, sp:.25, life:[.2,.4], size:[.22,.05], g:PAL[el].core }); }); });
  const N = 7;
  for (let i=0;i<N;i++){
    const s = V(rand(-.3,.3), rand(.9,1.6), rand(-.2,.1)), ang = i/N*TAU, e = V(Math.cos(ang)*.4, .5 + i*.25, 11 + Math.sin(ang)*.4);
    const c1 = s.clone().add(V(rand(-3.5,3.5), rand(1,3.5), 2.5)), c2 = e.clone().add(V(rand(-2.5,2.5), rand(1,2.5), -3.5));
    const bez = u => { const iu = 1-u; return V(
      iu*iu*iu*s.x + 3*iu*iu*u*c1.x + 3*iu*u*u*c2.x + u*u*u*e.x,
      iu*iu*iu*s.y + 3*iu*iu*u*c1.y + 3*iu*u*u*c2.y + u*u*u*e.y,
      iu*iu*iu*s.z + 3*iu*iu*u*c1.z + 3*iu*u*u*c2.z + u*u*u*e.z); };
    let prevU = 0;
    S.task(.3 + i*.08, .9, (dt,k,lt) => {
      const u = easeOut(k), steps = Math.max(2, Math.ceil((u-prevU)*90));
      for (let j=1;j<=steps;j++){ const p = bez(prevU + (u-prevU)*j/steps), w = Math.sin(lt*14 + i)*.25*(1-u);
        NORM.spawn(p.x + w, p.y, p.z, 0,0,0, 3.4 - k*.6, .13, .1, pal.core, 0, 0, 0);
        if (j%4===0) ADD.spawn(p.x + w, p.y, p.z, 0,0,0, .5, .1, .04, pal.glint); }
      prevU = u;
      if (k >= 1) S.hit(.2);
    });
  }
  S.task(1.4, 1.6, (dt,k,lt) => {
    for (let j=0;j<Math.round(20*Q);j++){ const y = rand(.2, 2.3), a = y*7 + lt*2 + Math.floor(Math.random()*3)*TAU/3;
      NORM.spawn(Math.cos(a)*.32, y, 11 + Math.sin(a)*.32, 0,0,0, 2.4 - k, .1, .09, pal.core); }
    if (Math.random() < dt*5) S.hit(.08);
  });
  S.at(3.6, () => { for (let i=0;i<220*Q;i++){ const p = V(rand(-.5,.5), rand(.3,2.4), rand(2,11)), t = V(0, 1.3, 0);
    NORM.spawn(p.x,p.y,p.z, (t.x-p.x)/.6, (t.y-p.y)/.6, (t.z-p.z)/.6, .6, .12, .06, pal.core); } });
};

/* =====================================================================
   6. BOUCLE DE RENDU
   ===================================================================== */
const hud = document.getElementById("hud");
let last = performance.now(), fpsAcc = 0, fpsN = 0, fps = 60, loopOn = true, idleT = 0, current = 0;
let framing = null;
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  // cadrage de départ : plus large sur écran étroit pour garder lanceur et cible
  const narrow = w/h < 1.15;
  if (narrow !== framing){ framing = narrow;
    if (narrow){ camera.fov = 58; camera.position.set(-17, 9.5, 5.5); controls.target.set(0, -1.6, 5.5); }
    else { camera.fov = 48; camera.position.set(-14.5, 6.2, 6.5); controls.target.set(0, .2, 5.2); } }
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  const buf = renderer.getDrawingBufferSize(new THREE.Vector2());
  const sc = buf.y / (2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
  ADD.mat.uniforms.uScale.value = sc; NORM.mat.uniforms.uScale.value = sc;
}
new ResizeObserver(resize).observe(stage); resize();

const shakeOff = V();
function frame(now){
  const realDt = Math.min(.05, (now - last)/1000); last = now;
  const dt = realDt*S.speed;
  S.update(dt);
  ADD.update(dt, S.time); NORM.update(dt, S.time);
  // bras
  const arm = caster.userData.armR; arm.rotation.x += (caster.userData.pose - arm.rotation.x)*Math.min(1, realDt*12);
  // lumière d'effet
  S.flashI *= Math.exp(-5*dt); S.glowI += (S.glowT - S.glowI)*Math.min(1, dt*14); S.glowT = 0;
  fxLight.intensity = Math.min(6, Math.max(S.flashI, S.glowI)*.6);
  // cible (ressort)
  const du = dummy.userData; du.vel += (-60*du.ang - 7*du.vel)*dt; du.ang += du.vel*dt;
  du.ang = Math.max(-.6, Math.min(.6, du.ang)); du.inner.rotation.x = -du.ang; dummy.position.y = du.sink;
  // boucle
  if (loopOn && S.tasks.length === 0){ idleT += dt; if (idleT > 1.1 && ADD.n + NORM.n < 400){ idleT = 0; play(current); } } else idleT = 0;
  controls.update();
  S.shakeA *= Math.exp(-6*realDt);
  shakeOff.set(rand(-1,1), rand(-1,1), rand(-1,1)).multiplyScalar(S.shakeA*.25);
  camera.position.add(shakeOff);
  renderer.render(scene, camera);
  camera.position.sub(shakeOff);
  fpsAcc += realDt; fpsN++; if (fpsAcc > .5){ fps = Math.round(fpsN/fpsAcc); fpsAcc = 0; fpsN = 0; }
  hud.textContent = `${(ADD.n + NORM.n).toLocaleString("fr-FR")} particules · ${fps} i/s`;
  requestAnimationFrame(frame);
}

function play(i){
  const j = JUTSU[i]; S.reset();
  try { FX[j.fx]({ ...j.o }); } catch (e) { console.error(j.name, e); }
}

/* =====================================================================
   7. INTERFACE
   ===================================================================== */
const state = { rank:"all", el:"all" };
const tabsEl = document.getElementById("tabs"), chipsEl = document.getElementById("chips"), listEl = document.getElementById("list");
const rankVar = r => `var(--rank-${r.toLowerCase()})`;
function renderFilters(){
  const count = r => JUTSU.filter(j => (r === "all" || j.rank === r) && (state.el === "all" || j.el === state.el)).length;
  tabsEl.innerHTML = ["all", ...RANKS].map(r => `<button type="button" class="tab" data-r="${r}" aria-pressed="${state.rank === r}" style="--rank-color:${r === "all" ? "var(--paper)" : rankVar(r)}"><b>${r === "all" ? "Tous" : r}</b><small>${count(r)}</small></button>`).join("");
  chipsEl.innerHTML = [["all","Tous","全"], ...Object.entries(ELEMENTS).map(([k,v]) => [k, v.label, v.kanji])]
    .map(([k,l,kj]) => `<button type="button" class="chip" data-e="${k}" aria-pressed="${state.el === k}" style="--el:${k === "all" ? "var(--paper)" : `var(--el-${k})`}"><i>${kj}</i>${l}</button>`).join("");
}
function renderList(){
  const items = JUTSU.map((j,i) => ({ j, i })).filter(({j}) => (state.rank === "all" || j.rank === state.rank) && (state.el === "all" || j.el === state.el));
  if (!items.length){ listEl.innerHTML = `<li class="empty">Aucune technique pour ce rang et cet élément.</li>`; return; }
  let html = "", lastRank = "";
  items.forEach(({j,i}) => {
    if (j.rank !== lastRank){ lastRank = j.rank; html += `<li class="rank-head">Rang ${j.rank}</li>`; }
    html += `<li><button type="button" class="item" data-i="${i}" aria-current="${i === current}" style="--el:var(--el-${j.el});--rank-color:${rankVar(j.rank)}">
      <span class="el-seal">${ELEMENTS[j.el].kanji}</span>
      <span class="nm"><strong>${j.name}</strong><span>${j.fr}</span></span>
      <span class="rank ${j.rank}">${j.rank}</span></button></li>`;
  });
  listEl.innerHTML = html;
}
function select(i, scroll){
  current = i; const j = JUTSU[i];
  const card = document.getElementById("card");
  card.style.setProperty("--el", `var(--el-${j.el})`); card.style.setProperty("--rank-color", rankVar(j.rank));
  const r = document.getElementById("cRank"); r.textContent = j.rank; r.className = `big-rank ${j.rank}`;
  document.getElementById("cName").textContent = j.name;
  document.getElementById("cJp").textContent = `${j.jp} · ${j.fr}`;
  document.getElementById("cMeta").textContent = `Rang ${j.rank} · ${ELEMENTS[j.el].label} · ${j.type}`;
  document.getElementById("cDesc").textContent = j.desc;
  const pal = j.o.pal || { fire:"fire", wind:"wind", lightning:"lightning", water:"water", earth:"earth" }[j.el] || "mixte";
  document.getElementById("cFx").innerHTML = `Particules : <b>${FX_LABEL[j.fx] || j.fx}</b> · palette ${pal}`;
  listEl.querySelectorAll(".item").forEach(b => b.setAttribute("aria-current", +b.dataset.i === i));
  if (scroll){ const b = listEl.querySelector(`.item[data-i="${i}"]`); if (b) b.scrollIntoView({ block:"nearest" }); }
  try { localStorage.setItem("jutsu.current", String(i)); } catch (e) {}
  play(i);
}
tabsEl.addEventListener("click", e => { const b = e.target.closest(".tab"); if (!b) return; state.rank = b.dataset.r; renderFilters(); renderList(); });
chipsEl.addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; state.el = b.dataset.e; renderFilters(); renderList(); });
listEl.addEventListener("click", e => { const b = e.target.closest(".item"); if (b) select(+b.dataset.i); });
document.getElementById("bPlay").addEventListener("click", () => play(current));
const bLoop = document.getElementById("bLoop");
bLoop.addEventListener("click", () => { loopOn = !loopOn; bLoop.setAttribute("aria-pressed", loopOn); });
document.getElementById("speed").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  S.speed = +b.dataset.s; document.querySelectorAll("#speed button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
function visibleIdx(){ return [...listEl.querySelectorAll(".item")].map(b => +b.dataset.i); }
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (e.code === "Space"){ e.preventDefault(); play(current); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); const v = visibleIdx(); if (!v.length) return;
    let p = v.indexOf(current); p = p < 0 ? 0 : (p + (e.key === "ArrowDown" ? 1 : -1) + v.length) % v.length; select(v[p], true); }
});

let start = 0;
try { const s = +localStorage.getItem("jutsu.current"); if (s >= 0 && s < JUTSU.length) start = s; } catch (e) {}
renderFilters(); renderList(); select(start, true);
requestAnimationFrame(frame);
window.__jutsu = { JUTSU, play, select, S, ADD, NORM };
</script>
